[package]
name = "biblint"
description = "A deterministic BibTeX linter and formatter"
readme = "../../README.md"
keywords = ["bibtex", "bibliography", "linter", "formatter"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "biblint"
path = "src/main.rs"

[dependencies]
biblint-core.workspace = true
biblint-format.workspace = true
clap.workspace = true
serde_json.workspace = true
similar.workspace = true

[lints]
workspace = true
