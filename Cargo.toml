[workspace]
members = [
  "crates/biblint-syntax",
  "crates/biblint-format",
  "crates/biblint-core",
  "crates/biblint",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/christopherkenny/biblint"

[workspace.dependencies]
biblint-syntax = { path = "crates/biblint-syntax" }
biblint-format = { path = "crates/biblint-format" }
biblint-core = { path = "crates/biblint-core" }
clap = { version = "4.6.1", features = ["derive"] }
globset = "0.4.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "2.7.0"
toml = "0.8.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
